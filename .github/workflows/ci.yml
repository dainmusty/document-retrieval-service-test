name: Document Retrieval Service - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B -DskipTests clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/document-retrieval-service.jar