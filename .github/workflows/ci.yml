name: Document Retrieval Service - CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ARTIFACT_BUCKET: blueeagle-prod-app-doc-artifacts
  ARTIFACT_NAME: document-retrieval-service.jar

jobs:
  build:
    name: Test, Build and Publish Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Run tests
        run: mvn -B test

      - name: Build application
        run: mvn -B -DskipTests clean package

      - name: Verify JAR
        run: |
          ls -lh target/
          test -f target/document-retrieval-service.jar

      # ------------------------------------------------------------
      # GitHub OIDC diagnostic
      # ------------------------------------------------------------
      # This confirms exactly which repository, branch/ref, and
      # event GitHub is presenting during this workflow run.
      # We intentionally do NOT print the OIDC token itself.
      # ------------------------------------------------------------
      - name: Debug GitHub OIDC context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Ref name: $GITHUB_REF_NAME"
          echo "Event: $GITHUB_EVENT_NAME"

      # ------------------------------------------------------------
      # Authenticate GitHub Actions to AWS using OIDC
      # ------------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651706774390:role/gitactions-tf-role
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------
      # Publish immutable application artifact
      # ------------------------------------------------------------
      - name: Publish artifact to S3
        run: |
          aws s3 cp \
            target/${{ env.ARTIFACT_NAME }} \
            s3://${{ env.ARTIFACT_BUCKET }}/document-retrieval-service/${{ github.sha }}/${{ env.ARTIFACT_NAME }}

      # ------------------------------------------------------------
      # Verify artifact publication
      # ------------------------------------------------------------
      - name: Verify published artifact
        run: |
          aws s3 ls \
            s3://${{ env.ARTIFACT_BUCKET }}/document-retrieval-service/${{ github.sha }}/